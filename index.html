<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <nav>
            <h2>Netflix</h2>
             <h2></h2>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Series</a></li>
                <li><a href="#">Movies</a></li>
                <li><a href="#">Pages</a></li>
                <li><a href="#">Pricing</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>

        <div class="hero-section" id="hero-section">
            <ul>
                <li><a href="#">Suspenful</a></li>
                <li><a href="#">Thriller</a></li>
                <li><a href="#">Drama</a></li>
                <li><a href="#">Anime</a></li>
                <li><a href="#">Romance</a></li>
            </ul>

            <div class="btn-container">
                <button type="button" class="white">Play</button>
                <button type="button"></a>+ My List </button>
            </div>
        </div>
    </header>

    <div class="search-box">
        <input type="text" id="search" placeholder="Search by title...">
    </div>

    <section class="movies">
            <h2>Your Next Watch</h2>
            <a href="#">See All</a>

        <div class="movies-container">
            <div class="card" id="next">

            </div>
        </div>
    </section>


    <section class="movies">
            <h2>Action</h2>
            <a href="#">See All</a>
    

        <div class="movies-container">
            <div class="card" id="action">
               
            </div>
        </div>
    </section>

    <section class="cartoon">
            <h2>Kids Corner</h2>
            <a href="#">See All</a>

        <div class="movies-container">
            <div class="card" id="kids"> 

            </div>
        </div>
    </section>


    <div id="movieModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
    
            <img id="modalPoster" src="" alt="Movie Poster">
    
            <div class="movie-info">
                <h2 id="modalTitle"></h2>
                <p id="modalDate"></p>
                <p id="modalRating"></p>
                <p id="modalOverview"></p>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
